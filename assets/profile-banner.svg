<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Maruhsoft — Engineering with intent</title>
  <desc id="desc">A dark indigo and violet abstract technical banner with a connected geometric network.</desc>
  <defs>
